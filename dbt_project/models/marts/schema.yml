version: 2

models:
  - name: dim_client
    columns:
      - name: client_id
        tests:
          - unique
          - not_null
      - name: credit_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 300
              max_value: 900

  - name: dim_loan
    columns:
      - name: loan_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_client')
              field: client_id
      - name: status
        tests:
          - accepted_values:
              values: ['active', 'paid_off', 'defaulted', 'delinquent']
      - name: loan_status
        tests:
          - accepted_values:
              values: ['Fully Paid', 'Charged Off', 'Current']
      - name: principal_amount_eur
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: installment
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: int_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: total_payment
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: fact_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: loan_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_loan')
              field: loan_id
      - name: amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: dim_exchange_rate
    columns:
      - name: currency_code
        tests:
          - unique
          - not_null
      - name: rate_per_usd
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
